<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hangman</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 1rem;
  }
  .home-btn {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 999;
    background: rgba(247, 37, 133, 0.08);
    border: 1px solid rgba(247, 37, 133, 0.2);
    color: #f72585;
    padding: 7px 14px;
    border-radius: 8px;
    text-decoration: none;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    transition: all 0.2s ease;
    cursor: pointer;
    backdrop-filter: blur(6px);
  }
  .home-btn:hover {
    background: rgba(247, 37, 133, 0.18);
    border-color: #f72585;
    transform: translateY(-1px);
  }
  .container {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 2rem;
    padding: 2rem 2.5rem;
    max-width: 680px;
    width: 100%;
    box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    text-align: center;
  }
  h1 {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: #fff;
    margin-bottom: 1rem;
    text-transform: uppercase;
  }
  h1 span { color: #f72585; }

  /* Hangman SVG */
  .gallows {
    width: 200px;
    height: 240px;
    margin: 0 auto 1.2rem;
    display: block;
  }
  .gallows line, .gallows circle {
    stroke: #e0e0e0;
    stroke-width: 3;
    fill: none;
    stroke-linecap: round;
  }

  /* Word display */
  .word {
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-bottom: 1.5rem;
  }
  .letter-box {
    width: 2.4rem;
    height: 2.8rem;
    border-bottom: 3px solid rgba(255,255,255,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    font-weight: 700;
    color: #fff;
    text-transform: uppercase;
    transition: all 0.2s;
  }
  .letter-box.revealed {
    border-bottom-color: #4cc9f0;
    color: #4cc9f0;
    transform: translateY(-2px);
  }
  .letter-box.space {
    border-bottom: none;
    width: 1.2rem;
  }

  /* Status */
  .status {
    color: rgba(255,255,255,0.7);
    font-size: 0.95rem;
    margin-bottom: 1rem;
  }
  .status strong { color: #f72585; }

  /* Wrong guesses */
  .wrong {
    color: rgba(255,255,255,0.5);
    font-size: 0.9rem;
    margin-bottom: 1.2rem;
    min-height: 1.4em;
  }
  .wrong span {
    display: inline-block;
    background: rgba(247,37,133,0.2);
    color: #f72585;
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    margin: 0.15rem;
    font-weight: 600;
  }

  /* Keyboard */
  .keyboard {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.4rem;
    margin-bottom: 1.2rem;
  }
  .key {
    width: 2.3rem;
    height: 2.6rem;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
  }
  .key:hover:not(:disabled) {
    background: rgba(255,255,255,0.18);
    transform: translateY(-2px);
  }
  .key:active:not(:disabled) { transform: translateY(0); }
  .key:disabled { opacity: 0.3; cursor: default; }
  .key.correct { background: #4cc9f0; border-color: #4cc9f0; color: #111; opacity: 1; }
  .key.wrong { background: #f72585; border-color: #f72585; color: #fff; opacity: 1; }

  /* Overlay */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(6px);
    justify-content: center;
    align-items: center;
    z-index: 100;
  }
  .overlay.show { display: flex; }
  .overlay-box {
    background: #1a1a2e;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 2rem;
    padding: 2.5rem 3rem;
    text-align: center;
    max-width: 400px;
    width: 90%;
    animation: popIn 0.35s ease;
  }
  @keyframes popIn {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .overlay-box h2 {
    font-size: 2rem;
    margin-bottom: 0.5rem;
  }
  .overlay-box h2.win { color: #4cc9f0; }
  .overlay-box h2.lose { color: #f72585; }
  .overlay-box p {
    color: rgba(255,255,255,0.7);
    font-size: 1.1rem;
    margin-bottom: 1rem;
  }
  .overlay-box .answer {
    color: #fff;
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    margin-bottom: 1.5rem;
  }
  .btn {
    display: inline-block;
    padding: 0.75rem 2rem;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .btn-primary {
    background: linear-gradient(135deg, #4361ee, #7209b7);
    color: #fff;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(67,97,238,0.4); }
  .btn-secondary {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.18); }

  /* Hint */
  .hint {
    color: rgba(255,255,255,0.4);
    font-size: 0.85rem;
    margin-bottom: 0.8rem;
    font-style: italic;
  }

  @media (max-width: 480px) {
    .container { padding: 1.5rem 1rem; }
    .key { width: 1.9rem; height: 2.2rem; font-size: 0.8rem; }
    .letter-box { width: 1.8rem; height: 2.2rem; font-size: 1.2rem; }
    .gallows { width: 160px; height: 190px; }
    h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<a href="index.html" class="home-btn">&#8962; Home</a>

<div class="container">
  <h1>Hang<span>man</span></h1>

  <svg class="gallows" viewBox="0 0 200 240">
    <!-- Base -->
    <line x1="20" y1="230" x2="180" y2="230" />
    <line x1="60" y1="230" x2="60" y2="20" />
    <line x1="60" y1="20" x2="150" y2="20" />
    <line x1="150" y1="20" x2="150" y2="45" />
    <!-- Rope -->
    <line id="part-rope" x1="150" y1="45" x2="150" y2="70" />
    <!-- Head -->
    <circle id="part-head" cx="150" cy="88" r="18" />
    <!-- Body -->
    <line id="part-body" x1="150" y1="106" x2="150" y2="160" />
    <!-- Left arm -->
    <line id="part-arm-l" x1="150" y1="120" x2="125" y2="140" />
    <!-- Right arm -->
    <line id="part-arm-r" x1="150" y1="120" x2="175" y2="140" />
    <!-- Left leg -->
    <line id="part-leg-l" x1="150" y1="160" x2="125" y2="190" />
    <!-- Right leg -->
    <line id="part-leg-r" x1="150" y1="160" x2="175" y2="190" />
  </svg>

  <div class="word" id="wordDisplay"></div>
  <div class="status" id="status">Remaining: <strong id="attempts">6</strong></div>
  <div class="wrong" id="wrongDisplay"></div>

  <div class="hint" id="hint"></div>

  <div class="keyboard" id="keyboard"></div>

  <button class="btn btn-secondary" id="newGameBtn">New Game</button>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-box">
    <h2 id="resultTitle">You Win!</h2>
    <p>The word was</p>
    <div class="answer" id="answerWord"></div>
    <button class="btn btn-primary" id="playAgainBtn">Play Again</button>
  </div>
</div>

<script>
const WORDS = [
  { word: "javascript", hint: "Language of the web" },
  { word: "hangman", hint: "This game" },
  { word: "developer", hint: "Someone who writes code" },
  { word: "keyboard", hint: "Input device for typing" },
  { word: "galaxy", hint: "A system of stars" },
  { word: "puzzle", hint: "A game that tests ingenuity" },
  { word: "rocket", hint: "Vehicle that goes to space" },
  { word: "python", hint: "A snake or a language" },
  { word: "oxygen", hint: "Gas we breathe" },
  { word: "jupiter", hint: "Largest planet" },
  { word: "diamond", hint: "Hardest natural substance" },
  { word: "umbrella", hint: "Keeps you dry in rain" },
  { word: "horizon", hint: "Where sky meets earth" },
  { word: "crystal", hint: "Clear, symmetrical mineral" },
  { word: "whisper", hint: "To speak very softly" },
  { word: "journey", hint: "A long trip" },
  { word: "bridge", hint: "Spans a river or gap" },
  { word: "shadow", hint: "Cast by light" },
  { word: "guitar", hint: "Stringed instrument" },
  { word: "winter", hint: "Coldest season" },
];

const PARTS = ["rope", "head", "body", "arm-l", "arm-r", "leg-l", "leg-r"];
const MAX_ATTEMPTS = 6;

let current = null; // { word, hint, display, guessed, wrong, attempts, gameOver }

function $(id) { return document.getElementById(id); }

// Build keyboard
function buildKeyboard() {
  const kb = $("keyboard");
  kb.innerHTML = "";
  for (let i = 65; i <= 90; i++) {
    const ch = String.fromCharCode(i);
    const btn = document.createElement("button");
    btn.className = "key";
    btn.textContent = ch;
    btn.dataset.letter = ch.toLowerCase();
    btn.addEventListener("click", () => handleGuess(ch.toLowerCase()));
    kb.appendChild(btn);
  }
}

function updateKeyboard() {
  document.querySelectorAll(".key").forEach(btn => {
    const l = btn.dataset.letter;
    btn.classList.remove("correct", "wrong");
    if (current.guessed.has(l)) {
      btn.classList.add(current.word.includes(l) ? "correct" : "wrong");
    }
    btn.disabled = current.guessed.has(l) || current.gameOver;
  });
}

function resetGame() {
  const entry = WORDS[Math.floor(Math.random() * WORDS.length)];
  current = {
    word: entry.word,
    hint: entry.hint,
    display: entry.word.split("").map(ch => ch === " " ? " " : "_"),
    guessed: new Set(),
    wrong: new Set(),
    attempts: MAX_ATTEMPTS,
    gameOver: false,
  };
  render();
  $("overlay").classList.remove("show");
  // Hide all body parts
  PARTS.forEach(id => {
    const el = $(`part-${id}`);
    if (el) el.style.display = "none";
  });
}

function render() {
  // Word
  $("wordDisplay").innerHTML = current.display.map(ch =>
    ch === " " ? `<div class="letter-box space"></div>`
      : ch === "_" ? `<div class="letter-box">_</div>`
      : `<div class="letter-box revealed">${ch}</div>`
  ).join("");

  $("attempts").textContent = current.attempts;

  // Wrong guesses
  const wrongArr = [...current.wrong];
  $("wrongDisplay").innerHTML = wrongArr.length
    ? "Wrong: " + wrongArr.map(l => `<span>${l}</span>`).join("")
    : "";

  $("hint").textContent = current.hint ? `Hint: ${current.hint}` : "";

  updateKeyboard();
}

function handleGuess(letter) {
  if (!current || current.gameOver) return;
  if (current.guessed.has(letter)) return;

  current.guessed.add(letter);

  if (current.word.includes(letter)) {
    // Reveal letter
    for (let i = 0; i < current.word.length; i++) {
      if (current.word[i] === letter) current.display[i] = letter;
    }

    // Check win
    if (!current.display.includes("_")) {
      current.gameOver = true;
      setTimeout(() => showResult(true), 400);
    }
  } else {
    current.wrong.add(letter);
    current.attempts--;

    // Show body part
    const partIndex = MAX_ATTEMPTS - current.attempts - 1;
    const partEl = $(`part-${PARTS[partIndex]}`);
    if (partEl) partEl.style.display = "block";

    // Check lose
    if (current.attempts === 0) {
      current.gameOver = true;
      setTimeout(() => showResult(false), 500);
    }
  }

  render();
}

function showResult(won) {
  const title = $("resultTitle");
  title.textContent = won ? "You Win!" : "Game Over";
  title.className = won ? "win" : "lose";
  $("answerWord").textContent = current.word;
  $("overlay").classList.add("show");
}

// Physical keyboard support
document.addEventListener("keydown", (e) => {
  if (e.repeat) return;
  const key = e.key.toLowerCase();
  if (/^[a-z]$/.test(key)) {
    const btn = document.querySelector(`.key[data-letter="${key}"]`);
    if (btn && !btn.disabled) handleGuess(key);
  }
  if (e.key === "Enter") {
    if ($("overlay").classList.contains("show")) resetGame();
  }
});

$("newGameBtn").addEventListener("click", resetGame);
$("playAgainBtn").addEventListener("click", resetGame);

buildKeyboard();
resetGame();
</script>
</body>
</html>
